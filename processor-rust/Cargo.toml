[package]
name = "auto-pricing-tool-processor"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
calamine = "0.36"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
indexmap = { version = "2", features = ["serde"] }
quick-xml = "0.41"
rayon = "1.10"
regex = "1.11"
rust_xlsxwriter = "0.93"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
umya-spreadsheet = "=3.0.1"
zip = "4.6"

[build-dependencies]
winres = "0.1.12"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
